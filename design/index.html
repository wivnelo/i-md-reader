x;z-index:6;max-width:90%;width:max-content}.note{max-width:1194px;margin:16px auto 0;color:#686e68;font-size:12px;line-height:1.7}.device.portrait .article{padding-top:60px}.toc a{display:block;color:var(--ink);padding:10px;text-decoration:none}.empty{padding:60px;text-align:center;color:var(--muted)}@media(max-width:750px){.review{flex-wrap:wrap}.review strong{width:100%}.stage{padding:0 8px 20px}.device{height:850px;border-width:5px;border-radius:18px}.device aside{width:230px}.device .article{padding:30px 22px;font-size:17px}.device .article h1{font-size:28px}.toolbar{padding:0 8px;gap:0}.device:not(.portrait) aside{display:none}.device.drawer aside{display:flex;position:absolute;inset:28px auto 0 0}.note{padding:0 10px}}@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<div class="popover" id="settings" hidden><strong>阅读外观</strong><label>字号 <input id="size" aria-label="正文字号" type="range" min="16" max="24" value="18"></label><label>主题 <select id="colors"><option value="light">浅色</option><option value="dark">深色</option></select></label><label>正文宽度 <select id="width"><option value="760">舒适</option><option value="680">紧凑</option><option value="820">宽阔</option></select></label></div><nav class="popover toc" id="toc" aria-label="文章目录" hidden></nav><div class="toast" id="toast" role="status" hidden></div></div><p class="note">设计原型：可切换横竖屏、主题、字号、文件及目录，收起侧栏进入沉浸阅读。来源、时间与文档均为演示数据；添加来源和刷新仅展示提示，不访问文件或网络。</p></div>
<script>
const $=id=>document.getElementById(id),device=$('device');
const pages={reading:{title:'为阅读留一点空间',path:'阅读笔记 / 设计与技术',html:`<div class="eyebrow">DESIGN NOTES</div><h1>为阅读留一点空间</h1><p class="dek">让内容慢下来，让注意力回到文字本身。</p><p>打开一篇文档，应该像翻开一本书。目录帮你找到方向，排版让你愿意停留；当阅读开始，界面便安静地退到一旁。</p><blockquote>好的阅读体验，不在于同时看见多少信息，而在于此刻能够专注多少。</blockquote><h2 id="rhythm">01 · 文字的节奏</h2><p>中文需要舒展的行距，英文需要自然的词间留白。标题、段落与引用各有自己的呼吸，而不是用一条条粗重的分隔线划开内容。</p><p>正文保持适当的宽度。无论横屏还是竖屏，视线都可以轻松找到下一行的起点。偶尔出现的 <code>inline code</code>，也应该融入文字的节奏。</p><h2 id="structure">02 · 清晰，但不喧闹</h2><p>文件夹保留原来的层级，文章保留原来的名字。只需要展开、选择，然后继续阅读。</p><div class="tablewrap"><table><thead><tr><th>内容</th><th>呈现方式</th><th>阅读目的</th></tr></thead><tbody><tr><td>文件树</td><td>柔和高亮，清晰缩进</td><td>快速找到方向</td></tr><tr><td>正文</td><td>舒适行距，居中列宽</td><td>专注长时间阅读</td></tr><tr><td>代码与表格</td><td>独立横向滚动</td><td>保留完整结构</td></tr></tbody></table></div><h2 id="code">03 · 代码也是内容</h2><p>保留缩进与语法层次，让技术文档同样易读。</p><div class="codebox"><div class="codehead"><span>SWIFT</span><button id="copycode">复制</button></div><pre><code><span class="kw">struct</span> ReadingPreferences {
    <span class="kw">var</span> fontSize: Double = 18
    <span class="kw">var</span> lineHeight: Double = 1.78
    <span class="comment">// 为文字留出呼吸的空间</span>
}</code></pre></div><p>接下来，读一读 <a href="#" data-nav="code">Swift 并发笔记</a>，或者收起目录，让这一页只属于文字。</p>`},code:{title:'Swift 并发笔记',html:`<div class="eyebrow">ENGINEERING</div><h1>Swift 并发笔记</h1><p class="dek">把等待留给任务，把流畅留给阅读。</p><h2>读取与呈现</h2><p>本文为排版示例。后台读取文档，界面呈现清晰的加载状态；切换文章时保留目录的位置。</p><div class="codebox"><div class="codehead">SWIFT</div><pre><code><span class="kw">let</span> document = <span class="kw">try await</span> provider.read(path)
<span class="kw">await</span> reader.display(document)</code></pre></div><h2>继续阅读</h2><p><a href="#" data-nav="reading">返回：为阅读留一点空间</a></p>`}};
const extras={links:['阅读清单','在文字之间，寻找值得反复阅读的内容。'],journal:['十月手记','留下一点观察，也留下一点空白。'],intro:['README','从左侧展开文件夹，选择一篇文章开始阅读。'],guide:['排版指南','标题建立层次，留白建立节奏。代码与表格保持各自的完整结构。'],offline:['离线阅读','此页为已缓存文档的视觉示例。实际缓存、网络状态和权限撤销行为尚未实现。'],repo:['README','一个安静的知识库，从一篇 Markdown 开始。']};for(const [key,[title,body]] of Object.entries(extras))pages[key]={title,html:`<div class="eyebrow">FIELD NOTES</div><h1>${title}</h1><p class="dek">${body}</p><h2>从这里开始</h2><p>保留熟悉的文件结构，把注意力留给内容。</p>`};
let current='reading',positions={};function show(key){positions[current]=$('reading').scrollTop;current=key;const p=pages[key];$('article').innerHTML=p.html;$('filename').textContent=p.title+'.md';const remote=['guide','offline','repo'].includes(key);$('refresh').hidden=!remote;$('location').textContent=p.path||(remote?'sample / field-notes / docs':'阅读笔记');document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('selected',b.dataset.page===key);if(b.dataset.page===key)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});$('toc').replaceChildren();$('article').querySelectorAll('h2').forEach((h,i)=>{h.id='section-'+i;const a=document.createElement('a');a.href='#'+h.id;a.textContent=h.textContent;a.onclick=e=>{e.preventDefault();h.scrollIntoView({behavior:'smooth'});$('toc').hidden=true;$('tocbutton').setAttribute('aria-expanded','false')};$('toc').append(a)});$('reading').scrollTop=positions[key]||0;device.classList.remove('drawer');updateProgress()}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,3500)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));$('article').onclick=async e=>{const a=e.target.closest('[data-nav]');if(a){e.preventDefault();show(a.dataset.nav)}if(e.target.id==='copycode'){try{await navigator.clipboard.writeText('struct ReadingPreferences {\n    var fontSize: Double = 18\n    var lineHeight: Double = 1.78\n}');toast('代码已复制')}catch{toast('浏览器未允许剪贴板访问，请选择代码复制')}}};
function orientation(p){device.classList.toggle('portrait',p);device.classList.remove('drawer','focus');$('port').setAttribute('aria-pressed',String(p));$('land').setAttribute('aria-pressed',String(!p))}$('land').onclick=()=>orientation(false);$('port').onclick=()=>orientation(true);function theme(d){device.classList.toggle('dark',d);$('colors').value=d?'dark':'light';$('theme').setAttribute('aria-pressed',String(d));$('theme').textContent=d?'浅色':'深色'}$('theme').onclick=()=>theme(!device.classList.contains('dark'));$('colors').onchange=e=>theme(e.target.value==='dark');$('sidebar').onclick=()=>{if(device.classList.contains('portrait')||innerWidth<=750)device.classList.toggle('drawer');else device.classList.toggle('focus')};$('scrim').onclick=()=>device.classList.remove('drawer');function pop(id,other,button){$(id).hidden=!$(id).hidden;$(other).hidden=true;$(button).setAttribute('aria-expanded',String(!$(id).hidden));$(other==='toc'?'tocbutton':'appearance').setAttribute('aria-expanded','false')}$('appearance').onclick=()=>pop('settings','toc','appearance');$('tocbutton').onclick=()=>pop('toc','settings','tocbutton');$('size').oninput=e=>$('article').style.fontSize=e.target.value+'px';$('width').onchange=e=>$('article').style.maxWidth=e.target.value+'px';$('add').onclick=()=>toast('原生版入口：添加本地文件夹 / 添加 GitHub 链接（尚未实现）');$('refresh').onclick=()=>toast('演示模式：尚未连接 GitHub');function updateProgress(){const r=$('reading'),max=r.scrollHeight-r.clientHeight;$('progress').textContent=Math.round(max>0?r.scrollTop/max*100:100)+'%'}$('reading').onscroll=updateProgress;document.addEventListener('keydown',e=>{if(e.key==='Escape'){device.classList.remove('drawer');$('toc').hidden=$('settings').hidden=true;$('appearance').setAttribute('aria-expanded','false');$('tocbutton').setAttribute('aria-expanded','false')}});show('reading');
</script></body></html>
