<div id="reader-palettes" aria-label="阅读器配色对比">
  <div class="palette-grid"></div>
  <template>
    <section class="palette"><h3></h3><div class="pair"></div></section>
  </template>
  <template id="reader-page-template">
    <div class="reader-page">
      <header><span>资料库 <b>＋</b></span><span>技术架构.md <b>☷　Aa</b></span></header>
      <div class="reader-layout">
        <aside><small>资料来源</small><div class="root">⌄ ▰ iMDReader <span>⟳</span></div><div class="row">　⌄ 产品与设计</div><div class="row">　　 ▤ 产品需求与验收.md</div><div class="row selected">　　 ▤ 技术架构.md</div><div class="row">　　 ▤ 阅读体验与视觉规范.md</div><div class="row">　› 开发记录</div><hr><div class="root">› ◉ swiftlang/swift-markdown <span>⟳</span></div><div class="row">　 ▤ README.md</div></aside>
        <article><h1>技术架构</h1><p>让阅读回到内容本身。保留熟悉的目录结构，以安静、清晰的界面承载长篇文字。</p><h2>来源与只读边界</h2><p>本地文件夹与公开 GitHub 来源共享目录树与阅读状态。刷新失败时，保留当前可读内容。</p><p><a>阅读体验与视觉规范 ↗</a></p><blockquote>只读取内容，不修改原始文件。</blockquote><pre><code>let reader = Reader()
reader.open(document)</code></pre><table><tr><th>模块</th><th>职责</th></tr><tr><td>目录</td><td>按需展开 · 保留进度</td></tr></table></article>
      </div><footer><span class="mode"></span><span>17pt · 1.65 行高</span></footer>
    </div>
  </template>
</div>
<style>
#reader-palettes .palette-grid{display:grid;gap:24px}#reader-palettes h3{font:500 16px -apple-system,sans-serif;margin:0 0 10px;color:light-dark(#303438,#d0d1d3)}
#reader-palettes .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}#reader-palettes .reader-page{border:1px solid var(--edge);border-radius:12px;overflow:hidden;background:var(--paper);color:var(--ink);font:400 12px -apple-system,BlinkMacSystemFont,sans-serif}
#reader-palettes header{display:grid;grid-template-columns:36% 64%;background:var(--bar);border-bottom:1px solid var(--edge);height:42px;align-items:center}#reader-palettes header>span{padding:0 14px}#reader-palettes b{float:right;color:var(--link);font-weight:500}#reader-palettes .reader-layout{display:grid;grid-template-columns:36% 64%;min-height:425px}#reader-palettes aside{background:var(--side);padding:15px 8px;border-right:1px solid var(--edge);overflow:hidden}#reader-palettes small{color:var(--secondary);font-size:11px;padding-left:7px}#reader-palettes .root{padding:14px 5px 10px;font-weight:500;font-size:11px}#reader-palettes .root span{float:right;color:var(--secondary)}#reader-palettes .row{padding:10px 4px;white-space:nowrap;font-size:10px;overflow:hidden;text-overflow:ellipsis}#reader-palettes .selected{background:var(--selection);border-radius:6px;color:var(--link)}#reader-palettes hr{border:0;border-top:1px solid var(--edge);margin:15px 0}#reader-palettes article{padding:24px 22px;line-height:1.65;min-width:0}#reader-palettes article h1{font-size:19px;font-weight:500;margin:0 0 14px}#reader-palettes article h2{font-size:15px;font-weight:500;margin:22px 0 10px}#reader-palettes p{margin:0 0 12px}#reader-palettes a{color:var(--link)}#reader-palettes blockquote{margin:12px 0;padding:4px 10px;border-left:2px solid var(--link);color:var(--secondary)}#reader-palettes pre{background:var(--code);padding:10px;border-radius:6px;overflow:hidden;font-size:10px;color:var(--link)}#reader-palettes table{width:100%;border-collapse:collapse;font-size:11px}#reader-palettes th{background:var(--code);font-weight:500}#reader-palettes td,#reader-palettes th{text-align:left;padding:5px;border-bottom:1px solid var(--edge)}#reader-palettes footer{display:flex;justify-content:space-between;padding:10px 14px;color:var(--secondary);border-top:1px solid var(--edge)}
@media(max-width:700px){#reader-palettes .pair{grid-template-columns:1fr}#reader-palettes .reader-layout{min-height:400px}}
</style>
<script>
{
 const root=document.getElementById('reader-palettes');
 const palettes=[
 {name:'雾蓝 · 推荐',light:['#fcfbf8','#30363b','#f2f4f5','#f7f7f5','#426b87','#e3ebf0','#eff2f3','#dce1e3','#66727a'],dark:['#252628','#c7c9cc','#202326','#292d31','#94b6cf','#344652','#2e3338','#3b4146','#a2abb3']},
 {name:'蓝灰 · 更克制',light:['#fcfbf8','#32363b','#f1f2f4','#f7f7f6','#596d87','#e6eaf0','#f0f1f3','#dfe1e5','#6e747e'],dark:['#252628','#c8c9cc','#222326','#2a2c31','#a3b3cd','#3b4353','#303239','#3d4048','#a7acb6']},
 {name:'青绿 · 接近现有',light:['#fcfbf8','#2e332f','#f1f4f1','#f7f8f4','#3d6b59','#e2ece6','#eef2ed','#dce3dc','#69756c'],dark:['#252628','#c7c7c9','#202123','#292d2c','#9db5a9','#34493f','#2e3230','#3b433e','#a4afa7']},
 {name:'暖灰 · 纸本感',light:['#fcfaf6','#3c3833','#f3f0eb','#f8f5ef','#80694e','#ece5da','#f0ece5','#e2dcd2','#7b7165'],dark:['#282624','#cec8c1','#23211f','#2f2c29','#c1ad90','#4b4236','#35302b','#484039','#afa498']}
 ];
 const tokens=['paper','ink','side','bar','link','selection','code','edge','secondary'];
 for(const palette of palettes){const section=root.querySelector('template').content.firstElementChild.cloneNode(true);section.querySelector('h3').textContent=palette.name;for(const mode of ['light','dark']){const page=document.getElementById('reader-page-template').content.firstElementChild.cloneNode(true);tokens.forEach((t,i)=>page.style.setProperty('--'+t,palette[mode][i]));page.querySelector('.mode').textContent=mode==='light'?'浅色':'深色';section.querySelector('.pair').append(page);}root.querySelector('.palette-grid').append(section);}
}
</script>
